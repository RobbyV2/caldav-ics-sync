[package]
name = "caldav-ics-sync"
description = "CalDAV/ICS sync service"
version = "0.2.5"
edition = "2024"

[workspace]
members = []

[lib]
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "http2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace", "cors"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
axum-extra = { version = "0.12", features = ["typed-header", "cookie"] }
async-stream = "0.3"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1"
config = { version = "0.15", default-features = false, features = [
  "convert-case",
] }
subtle = "2"
tokio-retry2 = "0.9"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
rand = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
itertools = "0.15"
jsonwebtoken = "11"
base64 = "0.23"
icalendar = "0.17"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
tower_governor = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
axum = { version = "0.8", features = ["ws", "http2"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
base64 = "0.23"

# Binaries are auto-discovered from src/bin/

[profile.release]
# The template uses opt-level = "z" because it ships a WASM module, where size is the
# binding constraint. This is a long-running sync server, so the default opt-level (3)
# is kept and only the link-time optimizations are adopted.
lto = true
codegen-units = 1
strip = true
